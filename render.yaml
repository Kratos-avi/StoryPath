services:
  - type: web
    name: storypath-app
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && cd ../frontend && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        # ⚠️ REQUIRED: Set this to a long random string in Render dashboard > Environment
        # Example: openssl rand -base64 32
        scope: build
      - key: FRONTEND_ORIGIN
        # ⚠️ REQUIRED: Set to your production frontend URL (comma-separated if multiple)
        # Example: https://your-frontend.onrender.com or https://yourdomain.com
        scope: build
      - key: DATABASE_URL
        scope: build
      - key: PORT
        value: "5000"