services:
  - type: web
    name: storypath
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && cd ../frontend && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        # ⚠️ REQUIRED: Set on Render Dashboard > Environment
        # Generate with: openssl rand -base64 32
        # Or use any long random string (32+ characters)
        scope: runtime
      - key: DATABASE_URL
        # ⚠️ REQUIRED: Your Aiven MySQL connection string
        # Format: mysql://user:pass@host:port/database?ssl-mode=REQUIRED
        scope: runtime
      - key: FRONTEND_ORIGIN
        # ⚠️ REQUIRED: Your production frontend URL (for CORS)
        # In unified deployment, this is the same as the service URL
        # Example: https://storypath.onrender.com
        scope: runtime